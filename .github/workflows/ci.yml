name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build
        env:
          # Build with placeholder public config so no live service is required.
          # Not VERCEL_ENV=production, so src/lib/seo.ts does not throw on the
          # placeholder domain. Clerk is disabled so the build needs no keys.
          NEXT_PUBLIC_SITE_URL: https://ci.example.com
          NEXT_PUBLIC_CLERK_ENABLED: "false"

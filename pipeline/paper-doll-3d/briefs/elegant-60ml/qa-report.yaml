  result: in-review
  clay_front: pipeline/paper-doll-3d/renders/elegant-60ml-clear/elegant60-clay-front.png
  clay_threequarter: pipeline/paper-doll-3d/renders/elegant-60ml-clear/elegant60-clay-threequarter.png
  rejected_revision:
    result: fail
    path: pipeline/paper-doll-3d/renders/elegant-60ml-clear/elegant60-clear-hero-front.png
    reason: Transmitted centered studio panels produced cloudy square forms that read as objects inside the bottle.
  rejected_revision_02:
    result: fail
    path: pipeline/paper-doll-3d/renders/elegant-60ml-clear/revision-02/elegant60-clear-hero-front.png
    markup: pipeline/paper-doll-3d/briefs/elegant-60ml/evidence/rejected-revision-02-shoulder-hole.jpg
    reason: The abrupt cavity flare and coplanar closed body/finish boundary refracted as a floating oval and apparent second hole below the neck.
  clear_glass_hero: pipeline/paper-doll-3d/renders/elegant-60ml-clear/revision-08/elegant60-clear-hero-front.png
  blender_master: pipeline/paper-doll-3d/master/working/elegant-60ml-clear/revision-08/elegant60-clear-master.blend
  lighting_profile: standard-off-axis
  backdrop: '#EFE9DE'
  visual_observations:
    - Broad front and flattened depth match the Elegant photographs.
    - Clear glass shows slim 1.6 mm side walls, an empty continuous cavity, polished molded edges and bore, and a centered fixed finish.
    - The inner shoulder opens continuously without an annular shelf, and the derived render shell removes the false coplanar body/finish boundary.
    - A faint continuous oval remains at the real open-bore transition; no dark hole, floating ring, boolean spoke, or separate internal object remains.
    - Operator reference requires the outer shoulder to read as a shallow crowned rise, the exposed neck land to remain compact, and the thread to read as a rounded continuous helix rather than separate rings.
    - Manufacturer-backed 18-415 dimensions and thread turns remain authoritative; the operator image guides visible character only.
    - No studio emitter is visible to transmission rays and no transmission back card is present.
    - Off-axis reflections define the shoulder, walls, base, and finish without forming a central rectangular patch.
    - Light neutral seamless studio matches the high-fidelity 9 ml visual language.
operator_disposition:
  acceptance_class: visual-production
  decision: revise
  notes: Operator rejected revision 01's transmitted cards and revision 02's apparent shoulder hole, then supplied the wall target calibrated for revision 08 and explicitly flagged the shoulder, neck, and thread character for comparison. Revision 08 remains in review; no manufacturing-accuracy or delivery-contract claim is made.

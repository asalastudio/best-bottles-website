    source_class: direct-photo
    source_ids: [drawing-2015, photo-front, photo-side]
    notes: The 2 x 45 degree drawing callout governs the outer base chamfer; photographs interpret molding softness.
  - segment: base
    source_class: direct-photo
    source_ids: [drawing-2015, photo-front, photo-side]
    notes: Drawing fixes the base flats; photographs interpret glass thickness and edge polish.
  - segment: push-up
    source_class: assumed
    source_ids: [drawing-2015]
    notes: Interior base contour is not sectioned; solve a restrained cavity to the 63 ml overflow value.

decisions:
  - issue: Elegant material master
    choice: All Elegant geometry masters are clear glass; frosting, if ever needed, is a derived material treatment.
    operator: Jordan Richter
    date: 2026-08-25
  - issue: First family member
    choice: Begin with Elegant 60 ml as a visual-production master.
    operator: Jordan Richter
    date: 2026-08-25
  - issue: Clear-glass optical correction
    choice: Reject the centered-softbox render; use the off-axis standard profile on #EFE9DE, with every studio card invisible to transmission rays and no internal/back card.
    operator: Jordan Richter
    date: 2026-08-25
  - issue: Elegant shoulder and body/finish interface
    choice: Reject revision 02's apparent second hole; use a vertically continuous inner shoulder and a derived matched-ring beauty-render shell while preserving separate body and fixed 18-415 source components.
    operator: Jordan Richter
    date: 2026-08-25
  - issue: Elegant visible wall target
    choice: Use the supplied slim-wall reference as the visual target; calibrate the visible side wall to 1.6 mm and retain capacity-gated uncertainty for unsectioned interior dimensions.
    operator: Jordan Richter
    date: 2026-08-25

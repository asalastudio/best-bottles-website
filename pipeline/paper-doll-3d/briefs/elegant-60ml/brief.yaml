    notes: Drawing fixes the 68.9 mm body line and overall envelope; original photographs and the supporting physical-family photo interpret one continuous curve with no floating annular shelf.
  - segment: body-wall
    source_class: direct-photo
    source_ids: [drawing-2015, photo-front, photo-side, operator-wall-target]
    notes: Drawing fixes width and depth; original photographs confirm broad flat faces and softened vertical corners. Calibrating the operator target against the 54.5 mm drawing width sets a 1.6 +/-0.15 mm visible side-wall read; the unseen depth offset remains capacity-solved rather than manufacturer-verified.
